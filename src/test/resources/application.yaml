spring:
  application:
    name: adventure-books

  # In-memory H2 database (tests only — overrides src/main/resources/application.yaml
  # because target/test-classes precedes target/classes on the test classpath)
  datasource:
    url: jdbc:h2:mem:adventurebooks;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # JPA / Hibernate
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

server:
  port: 8080

# Path (relative to classpath) where book JSON files are located
adventure-books:
  books-path: books
  cors:
    allowed-origins: http://localhost:4200

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
