services:
  postgres:
    image: postgres:16-alpine
    container_name: adventurebooks-postgres
    environment:
      POSTGRES_DB: adventurebooks
      POSTGRES_USER: adventurebooks
      POSTGRES_PASSWORD: adventurebooks
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adventurebooks -d adventurebooks"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adventurebooks-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: adventurebooks
      DB_USERNAME: adventurebooks
      DB_PASSWORD: adventurebooks
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: adventurebooks-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres-data:
